<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#f1efe9;--surface:#fffefb;--surface2:#eae6dc;--ink:#1c2420;--muted:#6b6155;--line:#ddd6c7;--line2:#c7bda8;
  --em:#0d6e4f;--em-soft:rgba(13,110,79,.1);--sl:#2f4f7a;--sl-soft:rgba(47,79,122,.09);
  --am:#9a5b0a;--am-soft:rgba(154,91,10,.12);--rd:#a4342a;--rd-soft:rgba(164,52,42,.1);--tl:#0a6b6b;--water:rgba(47,79,122,.14);
  --paper-line:rgba(28,36,32,.07)}
:root.dark{--bg:#11150f;--surface:#171d17;--surface2:#1e251d;--ink:#e9e6da;--muted:#9a9284;--line:#2b3327;--line2:#3c4936;
  --em:#4cbf90;--em-soft:rgba(76,191,144,.14);--sl:#8fb0e0;--sl-soft:rgba(143,176,224,.14);
  --am:#e0a33d;--am-soft:rgba(224,163,61,.15);--rd:#e2766b;--rd-soft:rgba(226,118,107,.14);--tl:#5ecccc;--water:rgba(143,176,224,.18);
  --paper-line:rgba(233,230,218,.06)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
#root{min-height:100%}
.serif{font-family:'Fraunces',Georgia,serif;font-weight:600;letter-spacing:-.01em}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace}
.num{font-family:'Fraunces',Georgia,serif;font-weight:600;letter-spacing:-.01em;font-variant-numeric:tabular-nums;line-height:1.04}
.card{background:var(--surface);border:1px solid var(--line);border-radius:4px}
.muted{color:var(--muted)}.c-em{color:var(--em)}.c-am{color:var(--am)}.c-rd{color:var(--rd)}.c-sl{color:var(--sl)}
.rule{border-top:1px solid var(--line)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:3px;font-size:12px;font-weight:600;line-height:1.6;white-space:nowrap;font-family:'IBM Plex Mono',monospace;letter-spacing:.01em}
.pill.em{background:var(--em-soft);color:var(--em)}.pill.am{background:var(--am-soft);color:var(--am)}
.pill.rd{background:var(--rd-soft);color:var(--rd)}.pill.sl{background:var(--sl-soft);color:var(--sl)}
.pill.mut{background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:8px 14px;border-radius:3px;border:1px solid var(--line2);background:var(--surface);color:var(--ink);font-weight:600;font-size:13.5px;cursor:pointer;transition:background .15s,border-color .15s}
.btn:hover:not(:disabled){background:var(--surface2)}.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--em);border-color:var(--em);color:#fff}
.btn.primary:hover:not(:disabled){opacity:.92}
.nav-btn{display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;padding:10px 12px;border-radius:3px;border-left:2px solid transparent;color:var(--muted);cursor:pointer;transition:background .15s,border-color .15s}
.nav-btn:hover{background:var(--surface2)}
.nav-btn[aria-current=page]{background:var(--em-soft);color:var(--ink);border-left-color:var(--em)}
.nav-btn[aria-current=page] .nav-ico{color:var(--em)}
.seg{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;padding:3px;border-radius:4px;background:var(--surface2);border:1px solid var(--line)}
.seg button{padding:8px 3px;border-radius:3px;font-weight:600;font-size:10px;color:var(--muted);cursor:pointer;border:0;background:transparent}
.seg button[aria-current=page]{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--line2)}
.scn{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:12px;border-radius:3px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);cursor:pointer;transition:border-color .2s,background .2s}
.scn:hover:not(:disabled){border-color:var(--line2);background:var(--surface)}
.scn-ico{flex:none;width:32px;height:32px;border-radius:3px;display:grid;place-items:center}
.scn-ico.rd{background:var(--rd-soft);color:var(--rd)}.scn-ico.sl{background:var(--sl-soft);color:var(--sl)}.scn-ico.am{background:var(--am-soft);color:var(--am)}.scn-ico.em{background:var(--em-soft);color:var(--em)}
.scn.on.rd{border-color:var(--rd);background:var(--rd-soft)}.scn.on.sl{border-color:var(--sl);background:var(--sl-soft)}.scn.on.am{border-color:var(--am);background:var(--am-soft)}.scn.on.em{border-color:var(--em);background:var(--em-soft)}
.switch{width:38px;height:22px;border-radius:11px;background:var(--line2);position:relative;transition:background .2s;flex:none;border:0;cursor:pointer;padding:0}
.switch::after{content:'';position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .2s}
.switch[aria-checked=true]{background:var(--em)}.switch[aria-checked=true]::after{transform:translateX(16px)}
:focus-visible{outline:2px solid var(--sl);outline-offset:2px;border-radius:2px}
input[type=range]{width:100%;accent-color:var(--em);height:22px;cursor:pointer}
.tbl{width:100%;border-collapse:collapse;min-width:640px}
.tbl th{font-weight:600;color:var(--muted);text-align:left;font-size:12px;padding:9px 13px;border-bottom:1px solid var(--line2);font-family:'IBM Plex Mono',monospace;letter-spacing:.01em}
.tbl td{padding:13px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.bar{height:7px;border-radius:2px;background:var(--line);overflow:hidden}.bar>i{display:block;height:100%;background:var(--em);transition:width .6s ease}
.row{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}
.ico-box{flex:none;width:30px;height:30px;border-radius:3px;background:var(--surface2);border:1px solid var(--line);display:grid;place-items:center;color:var(--muted)}
.tag{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.03em;color:var(--muted)}
.st-line{stroke:var(--line)}.st-em{stroke:var(--em)}.st-am{stroke:var(--am)}.st-rd{stroke:var(--rd)}.st-sl{stroke:var(--sl)}
.s-pipe{fill:none;stroke:var(--line2);stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
.s-flow{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:7 9;animation:flow 1s linear infinite}
.s-flow.em{stroke:var(--em)}.s-flow.rd{stroke:var(--rd)}.s-flow.sl{stroke:var(--sl)}.s-flow.am{stroke:var(--am)}
.s-box{fill:var(--surface2);stroke:var(--line2);stroke-width:1.5}
.s-box.rd{stroke:var(--rd);fill:var(--rd-soft)}
.s-txt{fill:var(--ink);font:600 12.5px 'Inter',sans-serif}
.s-sub{fill:var(--muted);font:500 11px 'Inter',sans-serif}
.s-sub.em{fill:var(--em)}.s-sub.am{fill:var(--am)}.s-sub.rd{fill:var(--rd)}.s-sub.sl{fill:var(--sl)}
.t-mut{fill:var(--muted);font:500 10.5px 'IBM Plex Mono',monospace}
.t-ink{fill:var(--ink);font:600 12px 'Inter',sans-serif}
.halo{paint-order:stroke;stroke:var(--surface);stroke-width:4px;stroke-linejoin:round}
.valve-arm{transition:transform .55s cubic-bezier(.4,0,.2,1)}
@keyframes flow{to{stroke-dashoffset:-16}}
.dot{width:7px;height:7px;border-radius:50%;background:var(--em);animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 var(--em-soft)}70%{box-shadow:0 0 0 6px transparent}100%{box-shadow:0 0 0 0 transparent}}
.toasts{position:fixed;z-index:50;top:calc(12px + env(safe-area-inset-top,0px));right:12px;left:12px;display:flex;flex-direction:column;gap:10px;pointer-events:none}
@media(min-width:640px){.toasts{left:auto;width:400px;right:20px}}
.toast{pointer-events:auto;display:flex;gap:12px;padding:14px;border-radius:4px;background:var(--surface);border:1px solid var(--line2);border-left-width:3px;box-shadow:0 10px 30px rgba(20,20,10,.16);animation:tin .28s ease}
.toast.rd{border-left-color:var(--rd)}.toast.sl{border-left-color:var(--sl)}.toast.am{border-left-color:var(--am)}.toast.em{border-left-color:var(--em)}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){.s-flow,.dot{animation:none}.toast{animation:none}.valve-arm,.bar>i,.switch,.switch::after{transition:none}}
.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch}
.numbox{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line2);background:var(--surface);border-radius:3px;padding:4px 8px;font-weight:600;white-space:nowrap;flex:none;font-family:'IBM Plex Mono',monospace}
.numbox:focus-within{outline:2px solid var(--sl);outline-offset:1px}
.numbox input{width:60px;background:transparent;border:0;color:inherit;font:inherit;text-align:right;outline:none;-moz-appearance:textfield}
.numbox input::-webkit-outer-spin-button,.numbox input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.rot{transform:rotate(180deg)}
.flash{display:inline-block;border-radius:2px;animation:hl 1s ease-out}
@keyframes hl{from{background:var(--em-soft)}to{background:transparent}}
@media(prefers-reduced-motion:reduce){.flash{animation:none}}
.eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:.04em;color:var(--muted)}
.watermark-lines{background-image:repeating-linear-gradient(transparent,transparent 27px,var(--paper-line) 27px,var(--paper-line) 28px)}
</style>

var num=function(v,dp){dp=dp==null?0:dp;return v.toLocaleString('en-US',{minimumFractionDigits:dp,maximumFractionDigits:dp})};

/* =========================================================================

   a result; every KPI is derived from these plus the live control-panel
   inputs, in computeFinance() / computeWQI().
   ========================================================================= */
var CONFIG={
 // -- classroom usage, per the brief: 20 pupils, 4 handwashes/day, 1.25 L/wash
 studentsPerUnit:20, washesPerDay:4, litersPerWash:1.25,
 // -- capital & schedule
 capexDefault:1100,           // EUR, one unit per classroom
 unitsInstalled:1,            // classrooms fitted so far (pilot)
 schoolClassrooms:8,          // classrooms in the school, for the scale-up case
 schoolDaysPerWeek:5,         // Mon-Fri only; no handwashing volume on Sat/Sun
 weeksPerMonth:52/12,         // 4.333, calendar weeks per month, for a school-day month figure
 opexDefault:22,              // EUR/month: power (UV lamp+pump) + filter media amortised
 electricityPrice:0.30,       // EUR/kWh, local tariff assumption
 // -- reporting cadence
 reportWeekday:5,             // 5 = Friday (0=Sun ... 6=Sat), ISO-ish for Date.getDay()
 weeksInService:12,           // weeks since commissioning, for the YTD figures
 lastWeekM3:0.63,             // measured volume in the prior week, for WoW badge
 // -- WQI engine: documented scoring model
 wqiSafeMin:80,               // WQI at/above this: SAFE, valve stays open
 wqiWarnMin:60,               // between warn and safe: CAUTION, watch closely
 phMin:6.5,phMax:8.5,phNeutral:7.5,phSlope:30,     // P_pH = |pH-7.5| x 30 outside 6.5-8.5
 ntuLimit:5.0,ntuSlope:12,                          // P_NTU = (NTU-5.0) x 12 above 5.0 NTU
 tdsLimit:500,tdsSlope:0.08,                        // P_TDS = (TDS-500) x 0.08 above 500 mg/L, new sensor tier
 // -- contamination classifier thresholds (new feature)
 classGrey:{ntu:5,tds:500,ph:[6.5,8.5]},            // within these: normal greywater, irrigate
 classAmber:{ntu:12,tds:900,ph:[6,9.5]},            // beyond grey but within amber: hold + recheck
 // amber and beyond => black water event: hard sewer bypass regardless of safeguard toggles
 // -- backwash (new feature)
 backwashIntervalDays:4, backwashDurationMin:6, backwashLiters:35, backwashKwh:0.4,
 // -- scenario constants
 spikePh:9.2, pumpKwh:1.5,
 blackWaterNtu:38, blackWaterTds:1450, blackWaterPh:9.6, // used by the black-water scenario

 // Warn/alarm bands are +-2 / +-3 standard deviations from the design baseline,
 // the standard SPC convention, not arbitrary numbers.
 ctrl:{
  ph:{target:7.4,warnSd:2,alarmSd:3,sd:0.35},
  ntu:{target:2.6,warnSd:2,alarmSd:3,sd:0.9},
  tds:{target:380,warnSd:2,alarmSd:3,sd:55},
  flow:{target:0.045,warnSd:2.5,alarmSd:3.5,sd:0.018},
  wqi:{target:96,warnSd:2,alarmSd:3,sd:3.2}
 },
 financeCtrl:{
  // acceptable variance of actual net savings vs the model's predicted net savings, per week
  varianceWarnPct:15, varianceAlarmPct:30,
  minSampleWeeks:2  // agent needs at least this many logged weeks before flagging variance
 },
 monitorHistoryLen:40 // ticks kept in the rolling control-chart buffer
};
var DEFAULTS={washes:4,liters:1.25,price:4.5,capex:1100,opex:22,units:1};
// -- AI optimizer: candidate catchment expansions and OPEX levers it searches over.

var CATCHMENT_OPTIONS=[
 {id:'handwash',label:'Handwashing sinks only (current)',mult:1,note:'Baseline: 20 pupils x 4 washes x 1.25L.',capexAdd:0},
 {id:'toilet',label:'+ Post-toilet washroom sinks',mult:2.8,note:'Adds washroom sinks used after toilet visits, roughly 6 uses/pupil/day at 0.5L.',capexAdd:150},
 {id:'playground',label:'+ Outdoor playground tap',mult:3.6,note:'Adds a monitored outdoor tap, flat ~20L/school-day.',capexAdd:80},
 {id:'both',label:'+ Both washroom and playground',mult:4.4,note:'Combined catchment. Requires two extra intake lines to the collection tank.',capexAdd:220},
 {id:'kitchen',label:'+ Both, plus kitchen pre-rinse sink',mult:6.2,note:'Adds a supervised kitchen pre-rinse line. Largest realistic single-classroom catchment.',capexAdd:340}
];
var OPEX_OPTIONS=[
 {id:'asis',label:'Current OPEX (as quoted)',mult:1,note:'€22/month per unit, no change.'},
 {id:'bulk',label:'Bulk maintenance round, 4+ units',mult:0.82,note:'One technician visit covers multiple classrooms; needs 4+ units fitted.'},
 {id:'longlife',label:'Extended-life filter media',mult:0.68,note:'Lower-maintenance filter stage; slightly higher CAPEX not modelled here.'},

 {key:'capex',label:'Unit CAPEX (per classroom)',sym:['C','capex'],min:500,max:3000,step:25,dp:0,unit:'',prefix:'€'},
 {key:'opex',label:'Monthly OPEX per unit',sym:['C','opex'],min:5,max:100,step:1,dp:0,unit:'/ month',prefix:'€'},
 {key:'units',label:'Classrooms fitted',sym:['N','units'],min:1,max:CONFIG.schoolClassrooms,step:1,dp:0,unit:'of '+CONFIG.schoolClassrooms,prefix:''}
];
var RISKS=[
 {id:'bypass',name:'High-alkaline / contaminated water bypass',risk:'Plant and soil damage from unsafe irrigation',value:300,per:' / year'},
 {id:'drift',name:'Sensor drift detection (NTU)',risk:'Premature filter replacement on false signal',value:150,per:''},
 {id:'weather',name:'Weather-API predictive shut-off',risk:'Excess pump power used irrigating into rain',value:45,per:' / year'},
 {id:'backwash',name:'Scheduled backwash reminder',risk:'Filter fouling and early media replacement',value:90,per:' / year'}
];

/* ---------- hooks ---------- */
function useTween(target,ms){

 var s=useState(target),v=s[0],setV=s[1];var cur=useRef(target);

  if(reduceMotion()){cur.current=target;setV(target);return;}
  var from=cur.current,t0=performance.now(),raf;
  var step=function(t){var p=Math.min(1,(t-t0)/ms),e=1-Math.pow(1-p,3);cur.current=from+(target-from)*e;setV(cur.current);if(p<1)raf=requestAnimationFrame(step)};
  raf=requestAnimationFrame(step);

}
function useWidth(ref){

/* =========================================================================
   CALCULATION ENGINE — pure functions. No result is ever hardcoded; the KPI
   cards, the financial report and the WQI panel all read from here.
   ========================================================================= */

/* --- financial engine: per-unit and school-wide, weekly and monthly --- */
function computeFinance(i,lever){
 // The school operates Monday to Friday only: no handwashing volume accrues on Sat/Sun,
 // so a month is CONFIG.schoolDaysPerWeek x CONFIG.weeksPerMonth school days, not a flat 30.
 // `lever` is optional: {catchMult, opexMult, capexAdd} applied by the AI optimizer / lever picker.
 lever=lever||{catchMult:1,opexMult:1,capexAdd:0};
 var litersPerDay=CONFIG.studentsPerUnit*i.washes*i.liters*lever.catchMult; // baseline x catchment multiplier
 var Vday=litersPerDay/1000;                                  // m3/school-day, per unit
 var schoolDaysPerMonth=CONFIG.schoolDaysPerWeek*CONFIG.weeksPerMonth; // 5 x 4.333 = 21.67
 var Vweek=Vday*CONFIG.schoolDaysPerWeek;                      // m3/week, per unit (5 school days)
 var Vmonth=Vday*schoolDaysPerMonth;                           // m3/month, per unit (school days only)
 var opexEff=i.opex*lever.opexMult, capexEff=i.capex+lever.capexAdd;
 var Sgw=Vweek*i.price, Sgm=Vmonth*i.price;                    // gross savings, EUR
 var capexTot=capexEff*i.units, opexTot=opexEff*i.units;       // scaled to units fitted
 var SnMonth=Vmonth*i.units*i.price-opexTot;                   // net monthly savings, fleet
 var SnWeek=Vweek*i.units*i.price-opexTot*CONFIG.schoolDaysPerWeek/schoolDaysPerMonth;
 var Sannual=SnMonth*12;
 var T=SnMonth>0?capexTot/SnMonth:Infinity;                    // payback, months
 var roi3=(Sannual*3-capexTot)/capexTot*100;                   // 3-year ROI, %
 // school-wide projection if every classroom were fitted
 var fullUnits=CONFIG.schoolClassrooms;
 var fullCapex=capexEff*fullUnits, fullOpex=opexEff*fullUnits;
 var fullSn=Vmonth*fullUnits*i.price-fullOpex;
 var fullT=fullSn>0?fullCapex/fullSn:Infinity;
 var fullAnnual=fullSn*12;
 return{litersPerDay:litersPerDay,Vday:Vday,Vweek:Vweek,Vmonth:Vmonth,schoolDaysPerMonth:schoolDaysPerMonth,
  opexEff:opexEff,capexEff:capexEff,
  Sgw:Sgw,Sgm:Sgm,capexTot:capexTot,opexTot:opexTot,SnMonth:SnMonth,SnWeek:SnWeek,Sannual:Sannual,T:T,roi3:roi3,
  fullUnits:fullUnits,fullCapex:fullCapex,fullOpex:fullOpex,fullSn:fullSn,fullT:fullT,fullAnnual:fullAnnual};
}

/* --- AI optimizer: searches catchment x OPEX-lever combinations for the best
   payback at the current CAPEX/price/units, and reports the frontier so the
   recommendation is auditable rather than a black box. --- */
function runOptimizer(i){
 var results=[];
 CATCHMENT_OPTIONS.forEach(function(c){
  OPEX_OPTIONS.forEach(function(o){
   var litersPerDay=CONFIG.studentsPerUnit*i.washes*i.liters*c.mult;
   var Vday=litersPerDay/1000, schoolDaysPerMonth=CONFIG.schoolDaysPerWeek*CONFIG.weeksPerMonth;
   var Vmonth=Vday*schoolDaysPerMonth;
   var opexEff=i.opex*o.mult;
   var capexEff=i.capex+c.capexAdd;
   var capexTot=capexEff*i.units, opexTot=opexEff*i.units;
   var SnMonth=Vmonth*i.units*i.price-opexTot;
   var T=SnMonth>0?capexTot/SnMonth:Infinity;
   var Sannual=SnMonth*12;
   var roi3=capexTot>0?(Sannual*3-capexTot)/capexTot*100:-100;
   results.push({catchment:c,opexLever:o,Vmonth:Vmonth,opexEff:opexEff,capexEff:capexEff,capexTot:capexTot,SnMonth:SnMonth,T:T,roi3:roi3,
    feasible:isFinite(T)&&T<=36});
  });
 });
 results.sort(function(a,b){
  var fa=isFinite(a.T)?a.T:1e9, fb=isFinite(b.T)?b.T:1e9;
  return fa-fb;
 });
 var best=results[0];
 var minimal=results.filter(function(r){return r.feasible}).sort(function(a,b){
  return (a.catchment.mult+((1-a.opexLever.mult)*2))-(b.catchment.mult+((1-b.opexLever.mult)*2));
 })[0];
 return{all:results,best:best,minimal:minimal||best,feasibleCount:results.filter(function(r){return r.feasible}).length,total:results.length};
}
function useOptimizer(i){return useMemo(function(){return runOptimizer(i)},[i.washes,i.liters,i.price,i.capex,i.opex,i.units])}

/* --- WQI engine: documented, three-term penalty model (pH, NTU, TDS) --- */
function computeWQI(ph,ntu,tds){
 var inRange=ph>=CONFIG.phMin&&ph<=CONFIG.phMax;
 var pPh=inRange?0:Math.abs(ph-CONFIG.phNeutral)*CONFIG.phSlope;
 var pNtu=ntu<=CONFIG.ntuLimit?0:(ntu-CONFIG.ntuLimit)*CONFIG.ntuSlope;
 var pTds=tds<=CONFIG.tdsLimit?0:(tds-CONFIG.tdsLimit)*CONFIG.tdsSlope;
 var wqi=Math.max(0,100-pPh-pNtu-pTds);
 var band=wqi>=CONFIG.wqiSafeMin?'safe':wqi>=CONFIG.wqiWarnMin?'warn':'bad';
 return{ph:ph,ntu:ntu,tds:tds,inRange:inRange,pPh:pPh,pNtu:pNtu,pTds:pTds,wqi:wqi,band:band};
}

/* --- contamination classifier (new feature): grey / amber / black water --- */
function classify(ph,ntu,tds){
 var g=CONFIG.classGrey,a=CONFIG.classAmber;
 var phOkG=ph>=g.ph[0]&&ph<=g.ph[1], phOkA=ph>=a.ph[0]&&ph<=a.ph[1];
 if(ntu<=g.ntu&&tds<=g.tds&&phOkG)return{tier:'grey',label:'Grey water',tone:'em',action:'Route to storage, cleared for irrigation.'};
 if(ntu<=a.ntu&&tds<=a.tds&&phOkA)return{tier:'amber',label:'Amber, hold for recheck',tone:'am',action:'Hold in buffer, resample in 10 minutes before releasing.'};
 return{tier:'black',label:'Black water event',tone:'rd',action:'Hard bypass to sewer. Not overridable by safeguard toggles.'};
}

function useFinance(i,lever){return useMemo(function(){return computeFinance(i,lever)},[i.washes,i.liters,i.price,i.capex,i.opex,i.units,lever&&lever.catchMult,lever&&lever.opexMult,lever&&lever.capexAdd])}

/* =========================================================================
   AI MONITORING & CONTROL AGENT — continuous statistical process control
   over technical sensors and financial variance. Distinct from the
   Optimizer (a one-shot scenario search): this evaluates every live tick
   against control limits and keeps a rolling audit trail, the way a real
   SCADA/BMS alarm layer or a finance controller's variance report would.
   ========================================================================= */

/* --- technical channel: z-score each reading against its SPC band --- */
function ctrlEval(key,value){
 var c=CONFIG.ctrl[key];
 var z=(value-c.target)/c.sd;
 var az=Math.abs(z);
 var band=az<=c.warnSd?'in_control':az<=c.alarmSd?'warn':'alarm';
 return{key:key,value:value,target:c.target,sd:c.sd,z:z,band:band};
}
function evalTechnical(wq,live){
 var ph=ctrlEval('ph',wq.ph), ntu=ctrlEval('ntu',wq.ntu), tds=ctrlEval('tds',wq.tds),
  flow=ctrlEval('flow',live.flow), wqiC=ctrlEval('wqi',wq.wqi);
 var channels=[ph,ntu,tds,flow,wqiC];
 var alarms=channels.filter(function(c){return c.band==='alarm'});
 var warns=channels.filter(function(c){return c.band==='warn'});
 var overall=alarms.length?'alarm':warns.length?'warn':'in_control';
 return{channels:channels,alarms:alarms,warns:warns,overall:overall};
}

/* --- financial channel: is realised net savings tracking the model within tolerance --- */
function evalFinancial(actualWeeklyNet,predictedWeeklyNet,weeksLogged){
 if(weeksLogged<CONFIG.financeCtrl.minSampleWeeks||predictedWeeklyNet===0)
  return{status:'insufficient_data',variancePct:0,actual:actualWeeklyNet,predicted:predictedWeeklyNet};
 var variancePct=(actualWeeklyNet-predictedWeeklyNet)/Math.abs(predictedWeeklyNet)*100;
 var av=Math.abs(variancePct);
 var status=av<=CONFIG.financeCtrl.varianceWarnPct?'on_target':av<=CONFIG.financeCtrl.varianceAlarmPct?'watch':'off_target';
 return{status:status,variancePct:variancePct,actual:actualWeeklyNet,predicted:predictedWeeklyNet};
}

/* --- rolling control-chart buffer: keeps recent WQI/pH/NTU points with their band,
   so the UI can draw a live SPC strip rather than just a single verdict --- */
function pushMonitorPoint(buf,pt){
 var next=buf.concat([pt]);
 if(next.length>CONFIG.monitorHistoryLen)next=next.slice(next.length-CONFIG.monitorHistoryLen);
 return next;
}

/* --- simulated realised-savings series: what a school's actual meter reading would show
   week over week, with realistic noise, so the financial control channel has something to
   compare the model against. Deterministic (seeded), not random on every render. --- */
function mulberryB(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
var rngFin=mulberryB(7734201);
function gaussFin(){return Math.sqrt(-2*Math.log(rngFin()+1e-9))*Math.cos(2*Math.PI*rngFin())}
function makeRealisedWeeks(predictedWeekly,n){
 var out=[];
 for(var w=1;w<=n;w++){
  // realised tracks the model with +-12% typical noise, occasional larger excursions
  var noise=1+gaussFin()*0.12+(w===Math.round(n*0.7)?-0.28:0); // one deliberate dip, e.g. a half-term week
  out.push({week:w,actual:predictedWeekly*noise,predicted:predictedWeekly});
 }
 return out;
}

function useWqi(ph,ntu,tds){return useMemo(function(){return computeWQI(ph,ntu,tds)},[ph,ntu,tds])}

/* --- weekly reporting cadence: next Friday, week number in service --- */
function nextFriday(from){
 var d=new Date(from);
 var delta=(CONFIG.reportWeekday-d.getDay()+7)%7;
 if(delta===0)delta=7;
 d.setDate(d.getDate()+delta);d.setHours(9,0,0,0);
 return d;
}
function fmtDate(d){return d.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'})}

/* =========================================================================
   SIMULATED SENSOR STREAM
   ========================================================================= */
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
var rng=mulberry(20260921);
function gauss(){return Math.sqrt(-2*Math.log(rng()+1e-9))*Math.cos(2*Math.PI*rng())}
function bump(h,c,w){return Math.exp(-Math.pow((h-c)/w,2))}
function usage(h){h=((h%24)+24)%24;return Math.min(1,.95*bump(h,8.7,.7)+.7*bump(h,10.4,.6)+.9*bump(h,12.3,.7)+.55*bump(h,14.8,.8))}
function baseline(h){var u=usage(h);return{ph:7.3+.18*Math.sin((h-6)/24*2*Math.PI)+.3*u+gauss()*.04,ntu:1.7+2.1*u+gauss()*.12,flow:.008+.09*u*(.9+.2*rng()),tds:330+110*u+gauss()*4}}
var N=96;
function makeHistory(startH){var a=[];for(var i=0;i<N;i++){var b=baseline(startH+i*.25);a.push({ph:b.ph,ntu:b.ntu,g:b.ntu,tds:b.tds,flow:b.flow,f:0})}return a}
function nextPoint(last,vh,sim,protect){
 var b=baseline(vh);
 var soften=function(prev,target,tol){return prev+(target-prev)*(Math.abs(prev-target)>tol?.5:1)};
 var ph=sim.ph?CONFIG.spikePh:sim.black?CONFIG.blackWaterPh:soften(last.ph,b.ph,.25);
 var ntu,g,f=0;
 if(sim.drift){f=1;g=last.g;ntu=clamp(last.ntu*.4+(b.ntu+2.4)*.6+gauss()*.9,.3,8.5)}
 else if(sim.black){ntu=soften(last.ntu,CONFIG.blackWaterNtu,3);g=ntu}
 else{ntu=soften(last.ntu,b.ntu,.25);g=ntu}
 var tds=sim.black?soften(last.tds,CONFIG.blackWaterTds,60):soften(last.tds,b.tds+(sim.ph?140:0),25);
 var used=sim.drift&&protect.drift?g:ntu;
 var wqi=computeWQI(ph,used,tds).wqi;
 var blocked=wqi<CONFIG.wqiSafeMin&&(protect.bypass||classify(ph,used,tds).tier==='black');
 var flow=Math.max(0,soften(last.flow,blocked?.003:b.flow,.025));
 return{ph:ph,ntu:ntu,g:g,tds:tds,flow:flow,f:f};
}

var INIT={sim:{ph:false,rain:false,drift:false,black:false},protect:{bypass:true,drift:true,weather:true,backwash:true},toasts:[],log:[],

function reducer(s,a){
 switch(a.type){
  case 'trigger':{
   var sc=SCEN[a.key];if(s.sim[a.key])return s;
   var sim=Object.assign({},s.sim);sim[a.key]=true;
   var counts=JSON.parse(JSON.stringify(s.counts));if(sc.prot)counts[sc.prot][a.on?'caught':'missed']++;
   var t=s.tally;
   return Object.assign({},s,{sim:sim,counts:counts,
    tally:{avoided:t.avoided+(a.on?a.value:0),missed:t.missed+(a.on?0:a.value),kwh:t.kwh+(a.on?a.kwh:0),opexSaved:t.opexSaved+(a.on&&a.key==='rain'?a.value:0)},
    toasts:s.toasts.concat([{id:a.id,tone:a.tone,title:a.title,msg:a.msg}]),
    log:[{id:a.id,time:a.time,tone:a.tone,msg:a.msg}].concat(s.log).slice(0,30)});

function derive(sim,protect,wq,live){

 else pump={state:'OFF',note:'Idle, next cycle 18:00',tone:'mut',on:false};
 var stage1=calib?(protect.drift?{t:'Replacement paused',tone:'am'}:{t:'Replacement queued (false alarm)',tone:'rd'}):{t:'Healthy',tone:'em'};
 var mode=hardBlock?['Hard bypass: black-water event','rd']:
  !safe?(blocked?['Bypass active','rd']:['Contaminated water in storage','rd']):

  sim.rain?(protect.weather?['Irrigation auto-disabled','sl']:['Irrigating into rain','am']):['Normal operation','em'];
 var weather=sim.rain?{icon:'cloud-rain',label:'Rain likely',detail:'85% chance of rain in the next 2 hours',tone:'sl'}:
  {icon:'cloud-sun',label:'Partly cloudy',detail:'18% chance of rain over the next 6 hours',tone:'em'};
 return{safe:safe,blocked:blocked,leak:leak,calib:calib,hardBlock:hardBlock,cls:cls,
  fallback:calib&&protect.drift,
  status:hardBlock?'BLACK WATER / LOCKED OUT':safe?'SAFE / RECYCLING ACTIVE':'ALERT / WATER CONTAMINATED',
  statusTone:hardBlock?'rd':safe?'em':'rd',

  pump:pump,stage1:stage1,mode:mode,weather:weather};

/* ---------- time series ---------- */
function TimeSeries(p){
 var ref=useRef(null),w=useWidth(ref),hs=useState(null),hi=hs[0],setHi=hs[1];
 var H=124,pl=42,pr=8,pt=8,pb=20,data=p.data,n=data.length,d0=p.domain[0],d1=p.domain[1];
 var X=function(i){return pl+i/(n-1)*(w-pl-pr)};
 var Y=function(v){return pt+(1-(clamp(v,d0,d1)-d0)/(d1-d0))*(H-pt-pb)};
 var vals=data.map(p.pick);
 var tone=function(i){return p.toneOf?p.toneOf(data[i],vals[i]):'ok'};
 var rank={ok:0,warn:1,bad:2},runs=[],cur=null;
 for(var i=1;i<n;i++){var a=tone(i-1),b=tone(i),t=rank[a]>=rank[b]?a:b;
  if(cur&&cur.t===t)cur.p.push(i);else{cur={t:t,p:[i-1,i]};runs.push(cur)}}
 var path=function(ix){return ix.map(function(i,k){return (k?'L':'M')+X(i).toFixed(1)+' '+Y(vals[i]).toFixed(1)}).join(' ')};
 var all=vals.map(function(_,i){return i});
 var area=path(all)+' L'+X(n-1).toFixed(1)+' '+(H-pb)+' L'+X(0).toFixed(1)+' '+(H-pb)+' Z';
 var idx=hi==null?n-1:hi,v=vals[idx],tn=tone(idx),st=p.state(v,tn);
 var gid='ts'+p.title.replace(/\W/g,'');
 var mins=(n-1-idx)*15,ago=idx===n-1?'Now':(Math.floor(mins/60)+'h '+(mins%60)+'m ago');
 var col={ok:p.color,warn:'var(--am)',bad:'var(--rd)'};
 var onMove=function(e){var r=e.currentTarget.getBoundingClientRect();var px=(e.clientX-r.left)/r.width*w;setHi(clamp(Math.round((px-pl)/(w-pl-pr)*(n-1)),0,n-1))};
 return html`<div>
  <div className="flex flex-wrap items-baseline justify-between gap-x-3 gap-y-1">
   <div><span className="font-semibold">${p.title}</span> <span className="muted text-[12.5px]">${p.sensor}</span></div>
   <div className="flex items-center gap-2"><span className="muted mono text-[11.5px]">${ago}</span><span className="num" style=${{fontSize:19}}>${v.toFixed(p.dp)} <span className="muted mono" style=${{fontSize:12}}>${p.unit}</span></span><span className=${'pill '+st[1]}>${st[0]}</span></div>
  </div>
  <div ref=${ref} style=${{width:'100%',marginTop:6}}>
   <svg width=${w} height=${H} style=${{display:'block',touchAction:'pan-y'}} role="img" aria-label=${p.title+' over the last 24 hours. Latest '+vals[n-1].toFixed(p.dp)+' '+p.unit}>
    <defs><linearGradient id=${gid} x1="0" y1="0" x2="0" y2="1"><stop offset="0" stopColor=${p.color} stopOpacity=".18"/><stop offset="1" stopColor=${p.color} stopOpacity="0"/></linearGradient></defs>
    ${p.band&&html`<rect x=${pl} y=${Y(p.band.to)} width=${w-pl-pr} height=${Y(p.band.from)-Y(p.band.to)} style=${{fill:'var(--em-soft)'}}/>`}
    ${p.ticks.map(function(t){return html`<g key=${t}><line x1=${pl} x2=${w-pr} y1=${Y(t)} y2=${Y(t)} className="st-line" strokeWidth="1"/><text className="t-mut" x=${pl-6} y=${Y(t)+4} textAnchor="end">${t}</text></g>`})}
    ${p.band&&html`<text className="t-mut" x=${w-pr-4} y=${Y(p.band.to)+13} textAnchor="end">${p.band.label}</text>`}
    ${p.limit&&html`<g><line x1=${pl} x2=${w-pr} y1=${Y(p.limit.v)} y2=${Y(p.limit.v)} className="st-am" strokeWidth="1.5" strokeDasharray="5 4"/><text className="t-mut" x=${w-pr-4} y=${Y(p.limit.v)-5} textAnchor="end">${p.limit.label}</text></g>`}
    <path d=${area} fill=${'url(#'+gid+')'}/>
    ${runs.map(function(r,k){return html`<path key=${k} d=${path(r.p)} fill="none" strokeWidth="2" strokeLinejoin="round" strokeLinecap="round" style=${{stroke:col[r.t]}}/>`})}
    ${['-24h','-18h','-12h','-6h','now'].map(function(l,k){return html`<text key=${l} className="t-mut" x=${pl+k/4*(w-pl-pr)} y=${H-5} textAnchor=${k===0?'start':k===4?'end':'middle'}>${l}</text>`})}
    ${hi!=null&&html`<g><line x1=${X(idx)} x2=${X(idx)} y1=${pt} y2=${H-pb} className="st-line" strokeWidth="1.5" style=${{stroke:'var(--muted)'}}/><circle cx=${X(idx)} cy=${Y(v)} r="4.5" style=${{fill:col[tn],stroke:'var(--surface)',strokeWidth:2}}/></g>`}
    <rect x=${pl} y="0" width=${w-pl-pr} height=${H} fill="transparent" onPointerMove=${onMove} onPointerDown=${onMove} onPointerLeave=${function(){setHi(null)}}/>
   </svg>
  </div>
 </div>`;
}
function WaterQuality(p){
 var s=p.series;
 return html`<section className="card p-5">
  <div className="flex flex-wrap items-center justify-between gap-2">
   <h2 className="serif text-[19px]">Water quality, last 24 hours</h2>
   <span className="muted mono text-[12px]">Hover or touch a chart to read past values</span>

function NumInput(p){
 var s=useState(p.value.toFixed(p.dp)),txt=s[0],setTxt=s[1],foc=useRef(false);
 useEffect(function(){if(!foc.current)setTxt(p.value.toFixed(p.dp))},[p.value]);
 return html`<label className="numbox">${p.prefix&&html`<span className="muted">${p.prefix}</span>`}
  <input type="number" inputMode="decimal" id=${p.id} aria-label=${p.label} min=${p.min} max=${p.max} step=${p.step} value=${txt}
   onFocus=${function(){foc.current=true}}
   onBlur=${function(){foc.current=false;var n=parseFloat(txt);n=isFinite(n)?clamp(n,p.min,p.max):p.value;p.onCommit(n);setTxt(n.toFixed(p.dp))}}
   onChange=${function(e){setTxt(e.target.value);var n=parseFloat(e.target.value);if(isFinite(n)&&n>=p.min&&n<=p.max)p.onCommit(n)}}/>

}

     <input type="range" className="mt-3" aria-label=${d.label+' slider'} min=${d.min} max=${d.max} step=${d.step} value=${v} onChange=${function(e){p.set(d.key,parseFloat(e.target.value))}}/>
     <div className="flex justify-between muted mono text-[11px]"><span>${fm(d.min)}</span><span>${isDef?'default':'default '+fm(DEFAULTS[d.key])}</span><span>${fm(d.max)}</span></div>

/* ---------- formula readout (financial view) ---------- */
function FormulaCard(p){
 var i=p.inputs,f=p.fin,e0=function(v){return eur(v,0)},e2=function(v){return eur(v,2)};
 var rows=[
  {name:'Daily volume per classroom',f:'v_daily = n_wash × v_wash × students',calc:i.washes+' × '+i.liters.toFixed(2)+'L × '+CONFIG.studentsPerUnit,res:num(f.litersPerDay,0)+' L/day'},
  {name:'School days per month',f:'d_month = days_week × weeks_month',calc:CONFIG.schoolDaysPerWeek+' × '+num(CONFIG.weeksPerMonth,2)+' (Mon–Fri only, no weekend volume)',res:num(f.schoolDaysPerMonth,2)+' school days'},
  {name:'Monthly volume, fleet',f:'V_monthly = v_daily × d_month × N_units',calc:num(f.litersPerDay/1000,3)+'m³ × '+num(f.schoolDaysPerMonth,2)+' × '+i.units,res:num(f.Vmonth*i.units,2)+' m³/month'},
  {name:'Gross monthly savings, fleet',f:'S_gross = V_monthly × P_water',calc:num(f.Vmonth*i.units,2)+' × '+e2(i.price),res:e2(f.Vmonth*i.units*i.price)+'/month'},
  {name:'Net monthly savings, fleet',f:'S_net = S_gross − (C_opex × N_units)',calc:e2(f.Vmonth*i.units*i.price)+' − '+e0(f.opexTot),res:e2(f.SnMonth)+'/month',bad:f.SnMonth<=0},
  {name:'Annual net savings',f:'S_annual = S_net × 12',calc:e2(f.SnMonth)+' × 12',res:e0(f.Sannual)+'/year',bad:f.Sannual<=0},
  {name:'Payback period',f:'T_payback = C_capex / S_net',calc:e0(f.capexTot)+' / '+e2(f.SnMonth),res:isFinite(f.T)?num(f.T,1)+' months':'Never (S_net ≤ 0)',bad:!isFinite(f.T)},
  {name:'3-year ROI',f:'ROI_3yr = (S_annual × 3 − C_capex) / C_capex',calc:'('+e0(f.Sannual)+' × 3 − '+e0(f.capexTot)+') / '+e0(f.capexTot),res:(f.roi3>=0?'+':'')+num(f.roi3,1)+'%',bad:f.roi3<0}
 ];
 return html`<section className="card p-5">
  <h2 className="serif text-[19px]">Calculation engine</h2>
  <p className="muted text-[13px]">Live formulas with the current inputs substituted, fleet-wide (${i.units} of ${CONFIG.schoolClassrooms} classrooms fitted).</p>
  <div className="mt-2">${rows.map(function(r){return html`<div key=${r.name} className="py-3 rule">
   <div className="flex items-baseline justify-between gap-3"><span className="font-semibold text-[14px]">${r.name}</span><span className=${'num '+(r.bad?'c-rd':'')} style=${{fontSize:18}}><${Flash} v=${r.res}>${r.res}<//></span></div>
   <div className="text-[13px] muted mono mt-0.5">${r.f}</div>
   <div className="text-[12.5px] muted mono">${r.calc}</div>
  </div>`})}</div>
 </section>`;
}

/* ---------- cash-flow chart (all inputs are live) ---------- */
function CashFlow(p){
 var ref=useRef(null),w=useWidth(ref),hs=useState(null),hm=hs[0],setHm=hs[1];
 var H=290,pl=58,pr=16,pt=18,pb=30,capex=p.capex,opex=p.opex,sv=p.gross,T=p.T;
 var M=isFinite(T)?clamp(Math.ceil(T*1.6/6)*6,12,60):60;
 var cost=function(m){return capex+opex*m},sav=function(m){return sv*m};
 var top=Math.max(cost(M),sav(M)),stepY=top>6000?2000:top>3000?1000:top>1000?500:200;
 var yMax=Math.max(400,Math.ceil(top*1.06/stepY)*stepY);
 var X=function(m){return pl+m/M*(w-pl-pr)},Y=function(v){return pt+(1-v/yMax)*(H-pt-pb)};
 var bIn=isFinite(T)&&T<=M;
 var ticks=[];for(var v=0;v<=yMax;v+=stepY)ticks.push(v);
 var maxL=w<540?7:13,stepX=[1,2,3,4,6,12,24].filter(function(s){return M/s<=maxL-1})[0]||24,xs=[];for(var m=0;m<=M;m+=stepX)xs.push(m);
 var onMove=function(e){var r=e.currentTarget.getBoundingClientRect();var px=(e.clientX-r.left)/r.width*w;setHm(clamp((px-pl)/(w-pl-pr)*M,0,M))};
 var pts=function(a){return a.map(function(q){return X(q[0]).toFixed(1)+','+Y(q[1]).toFixed(1)}).join(' ')};
 var defEnd=bIn?T:M;
 var deficit=pts([[0,cost(0)],[defEnd,cost(defEnd)],[0,sav(0)]]);
 var profit=bIn?pts([[T,cost(T)],[M,cost(M)],[M,sav(M)]]):null;
 var hv=hm,near=bIn&&X(T)<pl+170;
 return html`<section className="card p-5">
  <div className="flex flex-wrap items-start justify-between gap-2">
   <div><h2 className="serif text-[19px]">Cumulative cash flow and CAPEX recovery</h2>
    <p className="muted text-[13px]">Months since installation, ${p.units} classroom${p.units>1?'s':''} fitted. Redraws with every input.${p.lever?' Scenario applied: '+p.lever+'.':''}</p></div>
   <div className="flex flex-wrap gap-4 text-[12.5px]"><span className="flex items-center gap-2"><i style=${{width:16,height:3,background:'var(--em)',display:'inline-block'}}></i> Cumulative savings</span><span className="flex items-center gap-2"><i style=${{width:16,height:3,background:'var(--am)',display:'inline-block'}}></i> CAPEX + OPEX</span></div>
  </div>
  <div ref=${ref} className="mt-3">
   <svg width=${w} height=${H} style=${{display:'block',touchAction:'pan-y'}} role="img" aria-label=${bIn?'Cash flow chart. Break-even at month '+T.toFixed(1):'Cash flow chart. Break-even is not reached in the plotted period.'}>
    ${ticks.map(function(t){return html`<g key=${t}><line x1=${pl} x2=${w-pr} y1=${Y(t)} y2=${Y(t)} className="st-line" strokeWidth="1"/><text className="t-mut" x=${pl-8} y=${Y(t)+4} textAnchor="end">${eur(t)}</text></g>`})}
    ${xs.map(function(m){return html`<text key=${m} className="t-mut" x=${X(m)} y=${H-8} textAnchor="middle">${m}</text>`})}
    <polygon points=${deficit} style=${{fill:'var(--am-soft)'}}/>
    ${profit&&html`<polygon points=${profit} style=${{fill:'var(--em-soft)'}}/>`}
    <line x1=${X(0)} y1=${Y(cost(0))} x2=${X(M)} y2=${Y(cost(M))} strokeWidth="3" strokeLinecap="round" style=${{stroke:'var(--am)'}}/>
    <line x1=${X(0)} y1=${Y(0)} x2=${X(M)} y2=${Y(sav(M))} strokeWidth="3" strokeLinecap="round" style=${{stroke:'var(--em)'}}/>
    ${bIn&&html`<g><circle cx=${X(T)} cy=${Y(sav(T))} r="6.5" style=${{fill:'var(--surface)',stroke:'var(--em)',strokeWidth:3.5}}/>
     <text className="t-ink halo" x=${near?X(T)+12:X(T)-12} y=${near?Y(sav(T))+24:Y(sav(T))-14} textAnchor=${near?'start':'end'}>Break-even: month ${T.toFixed(1)}</text></g>`}
    ${hv!=null&&html`<g><line x1=${X(hv)} x2=${X(hv)} y1=${pt} y2=${H-pb} strokeWidth="1.5" style=${{stroke:'var(--muted)'}}/><circle cx=${X(hv)} cy=${Y(sav(hv))} r="4" style=${{fill:'var(--em)'}}/><circle cx=${X(hv)} cy=${Y(cost(hv))} r="4" style=${{fill:'var(--am)'}}/></g>`}
    <rect x=${pl} y="0" width=${w-pl-pr} height=${H} fill="transparent" onPointerMove=${onMove} onPointerDown=${onMove} onPointerLeave=${function(){setHm(null)}}/>
   </svg>
  </div>
  <div className="mt-2 rounded-sm px-4 py-3 text-[13.5px]" style=${{background:'var(--surface2)',border:'1px solid var(--line)',minHeight:50}} aria-live="polite">
   ${hv!=null?html`<span><b>Month ${hv.toFixed(1)}</b>: savings ${eur(sav(hv))}, costs ${eur(cost(hv))}, net position <b className=${sav(hv)-cost(hv)>=0?'c-em':'c-am'}>${(sav(hv)-cost(hv)>=0?'+':'-')+eur(Math.abs(sav(hv)-cost(hv)))}</b></span>`:
    !isFinite(T)?html`<span className="c-rd">Gross savings of ${eur(sv,2)} a month do not cover OPEX of ${eur(opex)}, so CAPEX is never recovered at this scale.</span>`:
    html`<span>Break-even at month <b>${T.toFixed(1)}</b>. After that the fleet earns about <b className="c-em">${eur(sv-opex,2)}</b> a month net.</span>`}
  </div>
 </section>`;
}

  <div className="mt-3">
   ${Row('Base WQI','Starting score','100.0')}
   ${Row('pH penalty',wq.inRange?'pH '+wq.ph.toFixed(2)+' is inside '+CONFIG.phMin+' to '+CONFIG.phMax+', no penalty':'|'+wq.ph.toFixed(2)+' − '+CONFIG.phNeutral+'| × '+CONFIG.phSlope+' (outside safe band)','−'+f1(wq.pPh),wq.pPh>0?'c-rd':'')}
   ${Row('Turbidity penalty',(wq.ntu<=CONFIG.ntuLimit?wq.ntu.toFixed(1)+' NTU is at or below '+CONFIG.ntuLimit.toFixed(1)+', no penalty':'('+wq.ntu.toFixed(1)+' − '+CONFIG.ntuLimit.toFixed(1)+') × '+CONFIG.ntuSlope)+(d.fallback?'. Raw '+lv.ntu.toFixed(1)+' NTU ignored: sensor flagged, using last good value.':d.calib?'. Sensor flagged but the controller uses the raw value.':''),'−'+f1(wq.pNtu),wq.pNtu>0?'c-rd':'')}
   ${Row('TDS penalty',wq.tds<=CONFIG.tdsLimit?Math.round(wq.tds)+' mg/L is at or below '+CONFIG.tdsLimit+', no penalty':'('+Math.round(wq.tds)+' − '+CONFIG.tdsLimit+') × '+CONFIG.tdsSlope.toFixed(2),'−'+f1(wq.pTds),wq.pTds>0?'c-rd':'')}
   <div className="row" style=${{alignItems:'flex-start'}}>
    <div className="flex-1"><div className="font-semibold text-[14px] mono">WQI = max(0, 100 − ${f1(wq.pPh)} − ${f1(wq.pNtu)} − ${f1(wq.pTds)})</div>
     <div className="bar mt-2" style=${{position:'relative',overflow:'visible'}}><i style=${{width:wqi+'%',background:d.safe?'var(--em)':'var(--rd)'}}></i><span style=${{position:'absolute',left:CONFIG.wqiSafeMin+'%',top:-4,bottom:-4,width:2,background:'var(--ink)',opacity:.6}}></span></div>
     <div className="muted mono text-[11px] mt-1" style=${{paddingLeft:CONFIG.wqiSafeMin+'%',marginLeft:'-2ch'}}>${CONFIG.wqiSafeMin} threshold</div></div>
    <div className=${'num '+(d.safe?'c-em':'c-rd')} style=${{fontSize:28}}>${wqi.toFixed(1)}</div>
   </div>
  </div>
  <div className="mt-3 text-[13.5px] rounded-sm px-4 py-3" style=${{background:d.safe?'var(--em-soft)':'var(--rd-soft)'}}>
   ${d.hardBlock?html`<span><b>Black-water classifier override:</b> hard bypass regardless of WQI or safeguard state.</span>`:
    d.safe?html`<span><b>WQI ≥ ${CONFIG.wqiSafeMin}:</b> solenoid valve OPEN, recycling active.</span>`:
    d.blocked?html`<span><b>WQI &lt; ${CONFIG.wqiSafeMin}:</b> solenoid valve on BYPASS TO SEWER. Financial risk avoided: <b>${eur(d.riskAvoided)}</b>.</span>`:
    html`<span><b>WQI &lt; ${CONFIG.wqiSafeMin}:</b> the bypass safeguard is off, so the valve stays open. Financial exposure: <b>${eur(d.riskExposed)}</b>.</span>`}
  </div>
 </section>`;
}
ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);
})();

</script>
</body>
</html>
